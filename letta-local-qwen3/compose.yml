name: ${COMPOSE_PROJECT_NAME:-letta-local}

services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: ${OLLAMA_CONTAINER_NAME:-ollama}
    restart: unless-stopped

    # Docker Desktop / WSL2 will pass the NVIDIA GPU into the container.
    gpus: all

    # Keep this on loopback unless you deliberately want to expose the raw
    # unauthenticated Ollama API to the LAN.
    ports:
      - "${OLLAMA_BIND_ADDRESS:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"

    environment:
      OLLAMA_HOST: "0.0.0.0:11434"

      # 64K gives enough room for a ~50K working context plus Letta system
      # instructions, memory blocks, MCP tool schemas and model output.
      OLLAMA_CONTEXT_LENGTH: "${OLLAMA_CONTEXT_LENGTH:-65536}"

      # Important for long context on a 16 GB GPU.
      OLLAMA_FLASH_ATTENTION: "${OLLAMA_FLASH_ATTENTION:-1}"
      OLLAMA_KV_CACHE_TYPE: "${OLLAMA_KV_CACHE_TYPE:-q8_0}"

      # Avoid multiplying the KV-cache reservation by concurrent requests.
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-1}"

      # Chat model + small embedding model can normally coexist on 16 GB.
      OLLAMA_MAX_LOADED_MODELS: "${OLLAMA_MAX_LOADED_MODELS:-2}"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-30m}"

      # Force fully-local inference: no Ollama cloud models or web search.
      OLLAMA_NO_CLOUD: "${OLLAMA_NO_CLOUD:-1}"

    volumes:
      - type: bind
        source: ${EXTERNAL_LLM_ROOT}/ollama-data
        target: /root/.ollama  

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

    networks:
      - agent-network


  model-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: ${OLLAMA_INIT_CONTAINER_NAME:-ollama-model-init}
    restart: "no"

    depends_on:
      ollama:
        condition: service_healthy

    environment:
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_CHAT_MODEL: "${OLLAMA_CHAT_MODEL:-qwen3.5:9b-q4_K_M}"
      OLLAMA_EMBED_MODEL: "${OLLAMA_EMBED_MODEL:-nomic-embed-text:latest}"

    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "Pulling chat model: $$OLLAMA_CHAT_MODEL"
        ollama pull "$$OLLAMA_CHAT_MODEL"
        echo "Pulling embedding model: $$OLLAMA_EMBED_MODEL"
        ollama pull "$$OLLAMA_EMBED_MODEL"
        echo "Model initialization complete."

    networks:
      - agent-network

  letta:
    build:
      context: ${LETTA_BUILD_CONTEXT:-.}
      dockerfile: ${LETTA_DOCKERFILE:-Dockerfile.letta}

    image: ${LETTA_IMAGE:-local/letta-mcp:0.1.38}
    container_name: ${LETTA_CONTAINER_NAME:-letta}
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      model-init:
        condition: service_completed_successfully

    ports:
      - "${LETTA_BIND_ADDRESS:-127.0.0.1}:${LETTA_PORT:-8283}:8283"

    environment:
      ACCEPTABLE_ORIGINS: >-
        ${LETTA_ACCEPTABLE_ORIGINS:?LETTA_ACCEPTABLE_ORIGINS is not set}

      # Letta talks to Ollama over the private Compose network.
      # The /v1 suffix is the OpenAI-compatible endpoint expected by Letta's
      # Ollama provider integration.
      OLLAMA_BASE_URL: "http://ollama:11434/v1"

      LETTA_DEFAULT_LLM_HANDLE: >-
        ${LETTA_MODEL:-ollama/qwen3.5:9b-q4_K_M}

      LETTA_DEFAULT_EMBEDDING_HANDLE: >-
        ${LETTA_EMBEDDING_HANDLE:-ollama/nomic-embed-text:latest}

      LETTA_LLM_REQUEST_TIMEOUT_SECONDS: >-
        ${LETTA_LLM_REQUEST_TIMEOUT_SECONDS:-600}

      LETTA_LLM_STREAM_TIMEOUT_SECONDS: >-
        ${LETTA_LLM_STREAM_TIMEOUT_SECONDS:-1800}

      SECURE: "${LETTA_SECURE:-true}"

      LETTA_SERVER_PASSWORD: >-
        ${LETTA_SERVER_PASSWORD:?LETTA_SERVER_PASSWORD is not set}

      MCP_DISABLE_STDIO: "${MCP_DISABLE_STDIO:-false}"
      MCP_CONNECT_TO_SERVER_TIMEOUT: "${MCP_CONNECT_TO_SERVER_TIMEOUT:-120}"
      MCP_LIST_TOOLS_TIMEOUT: "${MCP_LIST_TOOLS_TIMEOUT:-120}"
      MCP_EXECUTE_TOOL_TIMEOUT: "${MCP_EXECUTE_TOOL_TIMEOUT:-120}"

      BUSINESS_MCP_URL: >-
        ${BUSINESS_MCP_URL:?BUSINESS_MCP_URL is not set}

      MCP_REMOTE_HOME: >-
        ${MCP_REMOTE_HOME:-/var/lib/mcp-remote}

    volumes:
      - type: bind
        source: ${EXTERNAL_LLM_ROOT}/letta-postgres-data
        target: /var/lib/postgresql/data

      - type: bind
        source: ${EXTERNAL_LLM_ROOT}/letta-mcp-data
        target: /var/lib/mcp-remote

    mem_limit: ${LETTA_MEM_LIMIT:-16g}
    memswap_limit: ${LETTA_MEMSWAP_LIMIT:-16g}

    networks:
      - agent-network

networks:
  agent-network:
    driver: bridge
